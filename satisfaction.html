<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>多摩祭2026 ワークショップ アンケート</title>
<link rel="stylesheet" href="style.css?v=8">
</head>
<body class="ws-page">
<div class="app">

  <p id="notice" class="notice" hidden></p>
  <p id="queue-status" class="notice" role="status" hidden></p>

  <section class="screen ws-screen">
    <p class="eyebrow">多摩祭2026</p>
    <h1 class="ws-title">ワークショップ アンケート</h1>
    <p class="hint">スタッフが お子さまに きいて、ボタンを おしてください。</p>

    <form id="ws-form" novalidate>

      <fieldset class="q">
        <legend>① きょうの ダンボールガチャ ペパポン ワークショップは たのしかった？</legend>
        <div class="choices faces" data-q="q1">
          <button type="button" class="choice" data-v="たのしかった" aria-pressed="false"><span class="face" aria-hidden="true">😆</span><span>たのしかった</span></button>
          <button type="button" class="choice" data-v="ふつう" aria-pressed="false"><span class="face" aria-hidden="true">😐</span><span>ふつう</span></button>
          <button type="button" class="choice" data-v="つまらない" aria-pressed="false"><span class="face" aria-hidden="true">😢</span><span>つまらない</span></button>
        </div>
      </fieldset>

      <fieldset class="q">
        <legend>② キットづくりは かんたんだった？ むずかしかった？</legend>
        <div class="choices" data-q="q2">
          <button type="button" class="choice" data-v="かんたん" aria-pressed="false"><span>かんたん</span></button>
          <button type="button" class="choice" data-v="ちょうどいい" aria-pressed="false"><span>ちょうどいい</span></button>
          <button type="button" class="choice" data-v="むずかしい" aria-pressed="false"><span>むずかしい</span></button>
        </div>
      </fieldset>

      <fieldset class="q">
        <legend>③ また やりたい？</legend>
        <div class="choices" data-q="q3">
          <button type="button" class="choice" data-v="やりたい" aria-pressed="false"><span>やりたい</span></button>
          <button type="button" class="choice" data-v="やりたくない" aria-pressed="false"><span>やりたくない</span></button>
        </div>
      </fieldset>

      <fieldset class="q">
        <legend>④ ひとこと（なくてもOK）</legend>
        <textarea id="ws-comment" rows="3" maxlength="500" placeholder="おもったこと・かんそうを いれてください"></textarea>
      </fieldset>

      <p id="ws-summary" class="ws-summary" aria-live="polite"></p>
      <p id="ws-error" class="error" role="alert" hidden></p>
      <button id="ws-submit" class="btn btn-primary btn-large" type="submit">送信して つぎの人へ</button>
    </form>

    <p id="ws-toast" class="ws-toast" role="status" hidden></p>

    <div class="ws-foot">
      <p class="count" id="ws-count"></p>
      <button id="ws-undo" class="btn btn-sub" type="button" disabled>直前の1件を取り消す</button>
      <p><a href="index.html">動画コンテストへ</a></p>
    </div>
  </section>

</div>

<script src="config.js?v=8"></script>
<script src="satisfaction.js?v=8"></script>
</body>
</html>
