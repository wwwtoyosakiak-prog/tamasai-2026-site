<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>多摩祭2026 ワークショップ アンケート</title>
<link rel="stylesheet" href="style.css?v=18">
</head>
<body class="ws-page">
<div class="app">

  <p id="notice" class="notice" hidden></p>
  <p id="stale" class="notice stale" role="alert" hidden>質問が変更されました。ページを更新してください。 <button type="button" id="stale-reload" class="btn btn-sub">ページを更新</button></p>
  <p id="queue-status" class="notice" role="status" hidden></p>

  <section class="screen ws-screen">
    <p class="eyebrow">多摩祭2026</p>
    <h1 class="ws-title">ワークショップ アンケート</h1>
    <p class="hint">スタッフが お子さまに きいて、ボタンを おしてください。</p>

    <form id="ws-form" novalidate>

      <fieldset class="q">
        <legend>① ペパポンを つくって、たのしかった？</legend>
        <div class="choices faces" data-q="q1">
          <button type="button" class="choice" data-v="たのしかった" aria-pressed="false"><span class="face" aria-hidden="true">😆</span><span>たのしかった</span></button>
          <button type="button" class="choice" data-v="ふつう" aria-pressed="false"><span class="face" aria-hidden="true">😐</span><span>ふつう</span></button>
          <button type="button" class="choice" data-v="たのしくなかった" aria-pressed="false"><span class="face" aria-hidden="true">😢</span><span>たのしくなかった</span></button>
        </div>
      </fieldset>

      <fieldset class="q">
        <legend>② きょう、わかったことは どれかな？（いくつでも）</legend>
        <div class="choices multi" data-q="q2" data-multi="1">
          <button type="button" class="choice" data-v="ダンボールは、リサイクルしてまたつかえる" aria-pressed="false"><span>ダンボールは、<br>リサイクルして また つかえる</span></button>
          <button type="button" class="choice" data-v="カプセルづくりは、しょうがいのあるひとのおしごとにつながる" aria-pressed="false"><span>カプセルづくりは、<br>しょうがいのある ひとの おしごとに つながる</span></button>
          <button type="button" class="choice" data-v="まだよくわからない" data-exclusive="1" aria-pressed="false"><span>まだ よくわからない</span></button>
        </div>
      </fieldset>

      <fieldset class="q">
        <legend>③ おうちのひとと、リサイクルを してみたい？</legend>
        <div class="choices" data-q="q3">
          <button type="button" class="choice" data-v="してみたい" aria-pressed="false"><span>してみたい</span></button>
          <button type="button" class="choice" data-v="まだわからない" aria-pressed="false"><span>まだ わからない</span></button>
          <button type="button" class="choice" data-v="したくない" aria-pressed="false"><span>したくない</span></button>
        </div>
      </fieldset>

      <fieldset class="q q-comment">
        <legend>④ ひとこと（なくてもOK）</legend>
        <textarea id="ws-comment" rows="2" maxlength="500" placeholder="おもったこと・かんそうを いれてください"></textarea>
      </fieldset>

      <p id="ws-summary" class="ws-summary" aria-live="polite"></p>
      <p id="ws-error" class="error" role="alert" hidden></p>
      <button id="ws-submit" class="btn btn-primary btn-large" type="submit">送信して つぎの人へ</button>
    </form>

    <p id="ws-toast" class="ws-toast" role="status" hidden></p>

    <div class="ws-foot">
      <p class="count" id="ws-count"></p>
      <button id="ws-undo" class="btn btn-sub" type="button" disabled>直前の1件を取り消す</button>
      <p><a href="index.html">動画コンテストへ</a></p>
    </div>
  </section>

</div>

<script src="config.js?v=18"></script>
<script src="satisfaction.js?v=18"></script>
</body>
</html>
